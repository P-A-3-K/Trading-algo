<title>__TICKER__ Candles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one trading screen. Header strip (ticker, price, controls), chart fills the rest, footer note. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #15191f; --muted: #5d6673; --line: #dfe3e8;
  --grid: #eceff3; --up: #12855f; --down: #c8423b; --accent: #2f5fd0;
  --vol-up: rgba(18,133,95,.28); --vol-down: rgba(200,66,59,.28);
  --l1: #2f5fd0; --l2: #c47a0c; --l3: #8a46c9; --l4: #0e8a9a;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1216; --panel: #151a20; --fg: #e6e9ee; --muted: #8b95a3; --line: #262d36;
  --grid: #1c2229; --up: #2fbf8a; --down: #ef6a61; --accent: #7aa2ff;
  --vol-up: rgba(47,191,138,.30); --vol-down: rgba(239,106,97,.30); --l1: #7aa2ff; --l2: #f0a63a; --l3: #b68cf0; --l4: #4cc6d4; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #151a20; --fg: #e6e9ee; --muted: #8b95a3; --line: #262d36;
  --grid: #1c2229; --up: #2fbf8a; --down: #ef6a61; --accent: #7aa2ff;
  --vol-up: rgba(47,191,138,.30); --vol-down: rgba(239,106,97,.30); --l1: #7aa2ff; --l2: #f0a63a; --l3: #b68cf0; --l4: #4cc6d4; color-scheme: dark; }

body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
.wrap { box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1400px; margin: 0 auto; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.id { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; min-width: 0; }
h1 { margin: 0; font: 600 26px/1 var(--sans); letter-spacing: .01em; }
.price { font: 500 22px/1 var(--mono); font-variant-numeric: tabular-nums; }
.chg { font: 500 14px/1 var(--mono); font-variant-numeric: tabular-nums; }
.chg.up { color: var(--up); } .chg.down { color: var(--down); }
.sub { color: var(--muted); font-size: 12px; letter-spacing: .02em; }
.controls { display: flex; gap: 6px; flex-wrap: wrap; }
button { font: 500 12px/1 var(--mono); letter-spacing: .04em; color: var(--muted); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; cursor: pointer; }
button:hover { color: var(--fg); }
button[aria-pressed="true"] { color: var(--panel); background: var(--accent); border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sep { width: 1px; background: var(--line); margin: 0 4px; }
.stage { position: relative; height: clamp(380px, 64vh, 780px); background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stage.eq { height: clamp(300px, 40vh, 440px); }
#chart, #equity { position: absolute; inset: 0; }
.results { display: flex; flex-direction: column; gap: 8px; }
.results[hidden] { display: none; }
.rhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
h2 { margin: 0; font: 600 16px/1.2 var(--sans); }
h2 small { font: 400 12px var(--sans); color: var(--muted); margin-left: 6px; }
.legend { position: absolute; top: 8px; left: 8px; z-index: 3; pointer-events: none; padding: 2px 6px; border-radius: 6px;
  background: color-mix(in srgb, var(--panel) 84%, transparent);
  font: 12px/1.5 var(--mono); font-variant-numeric: tabular-nums; color: var(--muted);
  display: flex; flex-wrap: wrap; gap: 2px 12px; max-width: calc(100% - 80px); }
.legend b { color: var(--fg); font-weight: 500; }
.legend .sw { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.strategy { font: 500 12px/1.3 var(--mono); color: var(--fg); background: var(--grid); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px; max-width: 100%; overflow-wrap: anywhere; }
.strategy[hidden] { display: none; }
.tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
table.stats { width: 100%; border-collapse: collapse; font-size: 13px; }
.stats th, .stats td { padding: 9px 14px; text-align: right; border-bottom: 1px solid var(--grid); vertical-align: top; }
.stats tr:last-child td { border-bottom: 0; }
.stats th { font: 500 11px/1.2 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stats th:first-child, .stats td:first-child { text-align: left; }
.stats td.num { font: 400 13px/1.4 var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.stats td.num.win { color: var(--fg); font-weight: 600; }
.stats td.num.win::before { content: "● "; color: var(--accent); font-size: 9px; vertical-align: 2px; }
.stats .lbl { font-weight: 500; }
.stats .why { display: block; color: var(--muted); font-size: 12px; }
.stats th:not(:first-child) { width: 22%; }
@media (max-width: 560px) {
  .stats th, .stats td { padding: 8px 10px; }
  .stats td.num { font-size: 12px; }
  .stats .why { font-size: 11px; }
}
.stats tr.group td { padding-top: 14px; font: 500 11px/1.2 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.appbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; padding: 10px 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.appbar[hidden] { display: none; }
.brand { font: 600 15px/1 var(--sans); letter-spacing: .02em; align-self: center; margin-right: 6px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field span { font: 500 11px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.appbar input, .appbar select { font: 500 14px/1.2 var(--mono); color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; }
.appbar input { width: 8.5em; text-transform: uppercase; }
.params { display: contents; }
.params .field span { max-width: 17em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar .param input { width: 7em; text-transform: none; }
.param.changed input { border-color: var(--accent); }
.appbar input:invalid { border-color: var(--down); }
.appbar select { max-width: 100%; }
.appbar input:focus-visible, .appbar select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.appbar button.run { color: var(--panel); background: var(--accent); border-color: var(--accent); padding: 9px 16px; font-size: 13px; }
.appbar button.run:disabled { opacity: .7; cursor: progress; }
.notice-box { border: 1px solid var(--line); border-left: 4px solid var(--down); border-radius: 8px; background: var(--panel);
  padding: 10px 14px; font-size: 13px; }
.notice-box ul { margin: 6px 0 0; padding-left: 18px; }
.notice-box code { font-family: var(--mono); }
.navlink { align-self: center; font: 500 13px/1 var(--mono); color: var(--accent); }
.desc { flex: 1 1 260px; min-width: 0; align-self: center; color: var(--muted); font-size: 13px; }
footer { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; }
footer a { color: inherit; }
</style>

<div class="wrap">
  <form class="appbar" id="appbar" method="get" action="/" hidden>
    <span class="brand">QuantLab</span>
    <label class="field"><span>Ticker</span>
      <input id="tickerIn" name="ticker" list="tickerList" autocomplete="off" spellcheck="false"
             maxlength="15" required pattern="[A-Za-z0-9][A-Za-z0-9.\-^=]{0,14}"
             title="A ticker symbol, e.g. SPY, AAPL, BRK-B, ^GSPC"></label>
    <datalist id="tickerList"></datalist>
    <label class="field"><span>Strategy</span><select id="stratIn" name="strategy"></select></label>
    <span id="settingsIn" class="params"></span>
    <button type="submit" class="run" id="runBtn">Run</button>
    <button type="button" id="resetBtn" hidden title="Put every setting back to the strategy's default">Reset</button>
    <a class="navlink" id="optLink" href="/optimize" title="Try every combination of this strategy's settings">Optimize →</a>
    <span class="desc" id="stratDesc"></span>
  </form>
  <div class="notice-box" id="stratNotice" role="status" hidden></div>
  <header>
    <div class="id">
      <h1 id="ticker">__TICKER__</h1>
      <span class="price" id="last">–</span>
      <span class="chg" id="chg"></span>
      <span class="sub" id="span"></span>
      <span class="strategy" id="strategy" hidden></span>
    </div>
    <div class="controls" role="group" aria-label="Chart range">
      <button type="button" data-months="1">1M</button>
      <button type="button" data-months="6">6M</button>
      <button type="button" data-months="12" aria-pressed="true">1Y</button>
      <button type="button" data-months="60">5Y</button>
      <button type="button" data-months="0">All</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" id="log" aria-pressed="false" title="Logarithmic price scale: equal % moves look equal">Log</button>
      <button type="button" id="tradesBtn" aria-pressed="true" title="Show or hide buy/sell arrows" hidden>Trades</button>
    </div>
  </header>
  <div class="stage">
    <div class="legend" id="legend"></div>
    <div id="chart"></div>
  </div>
  <section class="results" id="results" hidden aria-label="Backtest results">
    <div class="rhead">
      <h2>Growth of $10,000 <small>log scale · lower panel: drawdown from peak</small></h2>
    </div>
    <div class="stage eq">
      <div class="legend" id="rlegend"></div>
      <div id="equity"></div>
    </div>
    <div class="tablewrap" id="statsWrap" hidden>
      <table class="stats" id="stats">
        <thead><tr><th scope="col">Statistic</th><th scope="col">Strategy</th><th scope="col">Buy &amp; hold</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
  <footer>
    <span id="note">Daily bars. Drag to scroll, scroll wheel or pinch to zoom.</span>
    <span>Charts: TradingView Lightweight Charts™, © 2025 TradingView, Inc. <a href="https://www.tradingview.com/" target="_blank" rel="noopener">tradingview.com</a></span>
  </footer>
</div>

<script>/*__LIBRARY__*/</script>
<script>
const DATA = /*__DATA__*/null;
const LW = window.LightweightCharts;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = n => n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = t => String(t).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
const vol = n => n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(0) + "K" : String(n);
const bars = DATA.bars;
const last = bars[bars.length - 1], prev = bars[bars.length - 2] || last;

const chart = LW.createChart(document.getElementById("chart"), {
  autoSize: true,
  layout: { fontFamily: css("--mono"), fontSize: 11 },
  rightPriceScale: { borderVisible: false, scaleMargins: { top: 0.08, bottom: 0.24 } },
  timeScale: { borderVisible: false, rightOffset: 4, minBarSpacing: 0.02 },
  crosshair: { mode: LW.CrosshairMode.Normal },
});
const candles = chart.addSeries(LW.CandlestickSeries, { borderVisible: false, priceLineVisible: false,
  // the axis runs below zero to leave room for volume bars; prices are never negative, so hide those labels
  priceFormat: { type: "custom", minMove: 0.01, formatter: v => (v < 0 ? "" : v.toFixed(2)) } });
const volume = chart.addSeries(LW.HistogramSeries, { priceScaleId: "vol", priceFormat: { type: "volume" }, lastValueVisible: false, priceLineVisible: false });
chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });

// Strategy lines: "price" pane draws over the candles, "lower" in a panel below
const PALETTE = ["--l1", "--l2", "--l3", "--l4"];
const plots = (DATA.plots || []).map((p, i) => {
  const pane = p.pane === "lower" ? 1 : 0;
  const series = chart.addSeries(LW.LineSeries, {
    lineWidth: p.pane === "lower" && /level|threshold|entry|exit/i.test(p.name) ? 1 : 2,
    lineStyle: /level|threshold/i.test(p.name) ? LW.LineStyle.Dashed : LW.LineStyle.Solid,
    priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: pane === 0,
  }, pane);
  series.setData(p.points);
  return { ...p, series, token: PALETTE[i % PALETTE.length],
           byTime: new Map(p.points.map(pt => [pt.time, pt.value])) };
});
if (plots.some(p => p.pane === "lower")) {
  const panes = chart.panes();
  if (panes[1]) panes[1].setHeight(Math.round(document.getElementById("chart").clientHeight * 0.26));
}
// Trade markers: arrows at the fill price on the fill day
const fills = DATA.trades || [];
const SIDES = { buy: { shape: "arrowUp", pos: "atPriceBottom", token: "--up", label: "Buy" },
                cover: { shape: "arrowUp", pos: "atPriceBottom", token: "--up", label: "Cover" },
                sell: { shape: "arrowDown", pos: "atPriceTop", token: "--down", label: "Sell" },
                short: { shape: "arrowDown", pos: "atPriceTop", token: "--down", label: "Short" } };
const fillsByTime = new Map();
fills.forEach(f => { if (!fillsByTime.has(f.time)) fillsByTime.set(f.time, []); fillsByTime.get(f.time).push(f); });
const markers = LW.createSeriesMarkers(candles, []);
let showTrades = true;
function drawMarkers() {
  markers.setMarkers(!showTrades ? [] : fills.map(f => ({
    time: f.time, position: SIDES[f.side].pos, price: f.price,
    shape: SIDES[f.side].shape, color: css(SIDES[f.side].token), size: 2,
    text: fills.length <= 300 ? SIDES[f.side].label : undefined })));
}
const tradesBtn = document.getElementById("tradesBtn");
if (fills.length) {
  tradesBtn.hidden = false;
  tradesBtn.textContent = `Trades (${fills.length.toLocaleString()})`;
  tradesBtn.addEventListener("click", () => {
    showTrades = !showTrades;
    tradesBtn.setAttribute("aria-pressed", String(showTrades));
    drawMarkers();
  });
}
if (DATA.strategy) {
  const tag = document.getElementById("strategy");
  tag.textContent = DATA.strategy; tag.hidden = false;
}

function paint() {
  const up = css("--up"), down = css("--down");
  chart.applyOptions({
    layout: { background: { type: "solid", color: css("--panel") }, textColor: css("--muted"),
              panes: { separatorColor: css("--line"), separatorHoverColor: css("--grid") } },
    grid: { vertLines: { color: css("--grid") }, horzLines: { color: css("--grid") } },
    crosshair: { vertLine: { color: css("--muted"), labelBackgroundColor: css("--accent") },
                 horzLine: { color: css("--muted"), labelBackgroundColor: css("--accent") } },
  });
  candles.applyOptions({ upColor: up, downColor: down, wickUpColor: up, wickDownColor: down });
  const vu = css("--vol-up"), vd = css("--vol-down");
  volume.setData(bars.map(b => ({ time: b.time, value: b.volume, color: b.close >= b.open ? vu : vd })));
  plots.forEach(p => p.series.applyOptions({ color: p.color || css(p.token) }));
  if (typeof drawMarkers === "function") drawMarkers();
}
candles.setData(bars.map(({ time, open, high, low, close }) => ({ time, open, high, low, close })));
paint();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint);
new MutationObserver(paint).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

// Header
document.getElementById("last").textContent = fmt(last.close);
const d = last.close / prev.close - 1, chg = document.getElementById("chg");
chg.textContent = (d >= 0 ? "+" : "") + (d * 100).toFixed(2) + "%";
chg.className = "chg " + (d >= 0 ? "up" : "down");
document.getElementById("span").textContent =
  `${bars[0].time} → ${last.time} · ${bars.length.toLocaleString()} days · ${DATA.adjusted ? "adjusted for dividends & splits" : "unadjusted"}`;

// Legend: the bar under the cursor, or the latest bar
const legend = document.getElementById("legend");
const byTime = new Map(bars.map((b, i) => [b.time, i]));
function showBar(b) {
  const i = byTime.get(b.time), p = i > 0 ? bars[i - 1].close : b.open;
  const c = b.close / p - 1, col = c >= 0 ? "var(--up)" : "var(--down)";
  legend.innerHTML = `<span><b>${b.time}</b></span><span>O <b>${fmt(b.open)}</b></span><span>H <b>${fmt(b.high)}</b></span>` +
    `<span>L <b>${fmt(b.low)}</b></span><span>C <b>${fmt(b.close)}</b></span>` +
    `<span style="color:${col}">${c >= 0 ? "+" : ""}${(c * 100).toFixed(2)}%</span><span>Vol <b>${vol(b.volume)}</b></span>` +
    plots.map(p => {
      const v = p.byTime.get(b.time);
      return `<span><i class="sw" style="background:${p.color || css(p.token)}"></i>${esc(p.name)} <b>${v === undefined ? "–" : fmt(v)}</b></span>`;
    }).join("") +
    (fillsByTime.get(b.time) || []).map(f => {
      const sd = SIDES[f.side], pct = v => Math.round(Math.abs(v) * 100) + "%";
      return `<span style="color:var(${sd.token})">${sd.shape === "arrowUp" ? "▲" : "▼"} <b style="color:inherit">${sd.label}</b> @ ${fmt(f.price)} (${pct(f.from)} → ${pct(f.to)})</span>`;
    }).join("");
}
showBar(last);
const keyOf = t => typeof t === "string" ? t
  : `${t.year}-${String(t.month).padStart(2, "0")}-${String(t.day).padStart(2, "0")}`;
let eqSync = null;   // set below when there are results to show
chart.subscribeCrosshairMove(p => {
  const key = p.time ? keyOf(p.time) : null;
  showBar(key && byTime.has(key) ? bars[byTime.get(key)] : last);
  if (eqSync && p.sourceEvent) eqSync.follow(key);
});

// Range buttons and log scale
const rangeButtons = [...document.querySelectorAll("[data-months]")];
function setRange(months) {
  rangeButtons.forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.months === months)));
  if (!months) { chart.timeScale().fitContent(); return; }
  const end = new Date(last.time + "T00:00:00Z"), start = new Date(end);
  start.setUTCMonth(start.getUTCMonth() - months);
  const from = start.toISOString().slice(0, 10);
  chart.timeScale().setVisibleRange({ from: from < bars[0].time ? bars[0].time : from, to: last.time });
}
rangeButtons.forEach(b => b.addEventListener("click", () => setRange(+b.dataset.months)));
const logBtn = document.getElementById("log");
logBtn.addEventListener("click", () => {
  const on = logBtn.getAttribute("aria-pressed") !== "true";
  logBtn.setAttribute("aria-pressed", String(on));
  chart.priceScale("right").applyOptions({ mode: on ? LW.PriceScaleMode.Logarithmic : LW.PriceScaleMode.Normal });
});

// ---- Results: growth of $10,000 vs buy & hold, drawdown underneath ----------
if (DATA.equity) {
  const E = DATA.equity;
  document.getElementById("results").hidden = false;
  const money = v => "$" + (Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(2) + "M" : Math.abs(v) >= 1e4 ? (v / 1e3).toFixed(1) + "K" : Math.round(v).toLocaleString());
  const pctf = v => (v > 0 ? "+" : "") + v.toFixed(1) + "%";
  const eq = LW.createChart(document.getElementById("equity"), {
    autoSize: true, layout: { fontFamily: css("--mono"), fontSize: 11 },
    rightPriceScale: { borderVisible: false, mode: LW.PriceScaleMode.Logarithmic, scaleMargins: { top: 0.12, bottom: 0.06 } },
    timeScale: { borderVisible: false, rightOffset: 4, minBarSpacing: 0.02 },
    crosshair: { mode: LW.CrosshairMode.Normal },
  });
  const bench = eq.addSeries(LW.LineSeries, { lineWidth: 2, priceLineVisible: false, lastValueVisible: false,
    priceFormat: { type: "custom", formatter: money } }, 0);
  const strat = eq.addSeries(LW.LineSeries, { lineWidth: 2, priceLineVisible: false,
    priceFormat: { type: "custom", formatter: money } }, 0);
  const bdd = eq.addSeries(LW.LineSeries, { lineWidth: 1, priceLineVisible: false, lastValueVisible: false,
    priceFormat: { type: "custom", formatter: pctf } }, 1);
  const sdd = eq.addSeries(LW.BaselineSeries, { baseValue: { type: "price", price: 0 }, lineWidth: 1,
    priceLineVisible: false, lastValueVisible: false, priceFormat: { type: "custom", formatter: pctf } }, 1);
  bench.setData(E.benchmark); strat.setData(E.strategy); bdd.setData(E.benchmark_dd); sdd.setData(E.strategy_dd);
  const panes = eq.panes();
  if (panes[1]) panes[1].setHeight(Math.round(document.getElementById("equity").clientHeight * 0.34));

  function paintEq() {
    const down = css("--down");
    eq.applyOptions({
      layout: { background: { type: "solid", color: css("--panel") }, textColor: css("--muted"),
                panes: { separatorColor: css("--line"), separatorHoverColor: css("--grid") } },
      grid: { vertLines: { color: css("--grid") }, horzLines: { color: css("--grid") } },
      crosshair: { vertLine: { color: css("--muted"), labelBackgroundColor: css("--accent") },
                   horzLine: { color: css("--muted"), labelBackgroundColor: css("--accent") } },
    });
    strat.applyOptions({ color: css("--accent") });
    bench.applyOptions({ color: css("--muted") });
    bdd.applyOptions({ color: css("--muted") });
    sdd.applyOptions({ bottomLineColor: down, topLineColor: down,
      bottomFillColor1: `color-mix(in srgb, ${down} 30%, transparent)`, bottomFillColor2: `color-mix(in srgb, ${down} 8%, transparent)`,
      topFillColor1: "transparent", topFillColor2: "transparent" });
  }
  paintEq();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paintEq);
  new MutationObserver(paintEq).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  // Legend for the results panel
  const rlegend = document.getElementById("rlegend");
  const idx = new Map(E.strategy.map((p, i) => [p.time, i]));
  function showEq(key) {
    const i = idx.has(key) ? idx.get(key) : E.strategy.length - 1;
    const s = E.strategy[i], b = E.benchmark[i];
    const sw = t => `<i class="sw" style="background:${css(t)}"></i>`;
    rlegend.innerHTML = `<span><b>${s.time}</b></span>` +
      `<span>${sw("--accent")}Strategy <b>${money(s.value)}</b> (${pctf((s.value / E.start - 1) * 100)})</span>` +
      `<span>${sw("--muted")}Buy & hold <b>${money(b.value)}</b> (${pctf((b.value / E.start - 1) * 100)})</span>` +
      `<span style="color:var(--down)">Drawdown <b style="color:inherit">${E.strategy_dd[i].value.toFixed(1)}%</b> vs ${E.benchmark_dd[i].value.toFixed(1)}%</span>`;
  }
  showEq(null);

  // Keep both charts on the same dates: scroll/zoom and crosshair follow each other
  let syncing = false;
  const mirror = (from, to) => from.timeScale().subscribeVisibleLogicalRangeChange(r => {
    if (!r || syncing) return; syncing = true; to.timeScale().setVisibleLogicalRange(r); syncing = false;
  });
  mirror(chart, eq); mirror(eq, chart);
  eqSync = {
    follow(key) {
      showEq(key);
      if (key && idx.has(key)) eq.setCrosshairPosition(E.strategy[idx.get(key)].value, key, strat);
      else eq.clearCrosshairPosition();
    },
  };
  eq.subscribeCrosshairMove(p => {
    const key = p.time ? keyOf(p.time) : null;
    showEq(key);
    if (!p.sourceEvent) return;
    if (key && byTime.has(key)) { chart.setCrosshairPosition(bars[byTime.get(key)].close, key, candles); showBar(bars[byTime.get(key)]); }
    else { chart.clearCrosshairPosition(); showBar(last); }
  });
  eq.timeScale().setVisibleLogicalRange(chart.timeScale().getVisibleLogicalRange());
}


// Strategy menu: built-ins, then files from strategies/ (blocked ones can't be picked)
function strategyOptions(list) {
  const opt = s => `<option value="${esc(s.id)}"${s.problem ? " disabled" : ""} title="${esc(s.problem ? "Blocked: " + s.problem : s.file || "Built-in")}">` +
    `${esc(s.name)}${s.problem ? " ⚠ blocked" : ""}</option>`;
  const mine = list.filter(s => s.source === "user");
  return `<optgroup label="Built-in">${list.filter(s => s.source !== "user").map(opt).join("")}</optgroup>` +
    (mine.length ? `<optgroup label="Your strategies (strategies/ folder)">${mine.map(opt).join("")}</optgroup>` : "");
}
// A notice when a strategy file couldn't be loaded or a strategy is blocked
function strategyNotice(app) {
  const items = app.errors.map(e => `<li><code>${esc(e.file)}</code> didn't load: ${esc(e.error)}</li>`)
    .concat(app.strategies.filter(s => s.problem).map(s =>
      `<li><code>${esc(s.file)}</code>: <b>${esc(s.name)}</b> is blocked because ${esc(s.problem)}.</li>`));
  const el = document.getElementById("stratNotice");
  if (!items.length) { el.hidden = true; return; }
  el.innerHTML = `<b>Strategy file problems</b> (fix the file and reload the page)<ul>${items.join("")}</ul>`;
  el.hidden = false;
}

// ---- App controls (only when served by quantlab.app) -------------------------
if (DATA.app) {
  const A = DATA.app, form = document.getElementById("appbar");
  const tIn = document.getElementById("tickerIn"), sIn = document.getElementById("stratIn");
  const keep = document.getElementById("settingsIn"), run = document.getElementById("runBtn");
  const desc = document.getElementById("stratDesc");
  tIn.value = DATA.ticker;
  document.getElementById("tickerList").innerHTML = A.tickers.map(t => `<option value="${esc(t)}"></option>`).join("");
  const byId = Object.fromEntries(A.strategies.map(s => [s.id, s]));
  sIn.innerHTML = `<option value="none">None (candles only)</option>` + strategyOptions(A.strategies);
  strategyNotice(A);
  sIn.value = A.strategy;
  const describe = () => { desc.textContent = byId[sIn.value]?.description || "Just the price chart, no strategy."; };
  describe();
  // One number box per strategy setting, built from the strategy's params:
  // label, allowed range and step come from Param(default, min, max, label, step)
  const params = byId[A.strategy]?.params || {};
  keep.innerHTML = Object.entries(params).map(([k, p]) => {
    const value = A.settings[k] ?? p.default;
    const range = [p.min, p.max].every(v => v !== null) ? `${p.min}–${p.max}` : "";
    const changed = value !== p.default ? " changed" : "";
    return `<label class="field param${changed}" title="${esc((p.label || k) + (range ? " · allowed " + range : "") + " · default " + p.default)}">` +
      `<span>${esc(p.label || k)}</span>` +
      `<input type="number" name="${esc(k)}" value="${esc(value)}" required` +
      (p.min !== null ? ` min="${p.min}"` : "") + (p.max !== null ? ` max="${p.max}"` : "") +
      ` step="${p.step ?? "any"}" inputmode="${p.type === "int" ? "numeric" : "decimal"}"></label>`;
  }).join("");
  const resetBtn = document.getElementById("resetBtn");
  const anyChanged = Object.entries(params).some(([k, p]) => (A.settings[k] ?? p.default) !== p.default);
  resetBtn.hidden = !anyChanged;
  resetBtn.addEventListener("click", () => {
    keep.querySelectorAll("input").forEach(i => { i.value = params[i.name].default; });
    form.requestSubmit();
  });
  sIn.addEventListener("change", () => {      // new strategy: start from its defaults
    keep.innerHTML = ""; describe(); form.requestSubmit();
  });
  tIn.addEventListener("input", () => { tIn.value = tIn.value.toUpperCase(); });
  form.addEventListener("submit", () => {
    const t = tIn.value.trim().toUpperCase(); tIn.value = t;
    run.disabled = true;
    run.textContent = A.tickers.includes(t) ? "Loading…" : `Downloading ${t}…`;
  });
  window.addEventListener("pageshow", () => { run.disabled = false; run.textContent = "Run"; });
  const optLink = document.getElementById("optLink");
  const sweepable = Object.keys(params).length > 0;
  optLink.hidden = !sweepable;
  if (sweepable) optLink.href = `/optimize?ticker=${encodeURIComponent(DATA.ticker)}&strategy=${encodeURIComponent(A.strategy)}`;
  form.hidden = false;
}

// ---- Stats table --------------------------------------------------------------
if (DATA.stats) {
  const F = {
    money: v => "$" + Math.round(v).toLocaleString(),
    pct: v => (v * 100).toFixed(1) + "%",
    num: v => v.toFixed(2),
    int: v => Math.round(v).toLocaleString(),
    days: v => v >= 252 ? (v / 252).toFixed(1) + " yrs" : Math.round(v) + " days",
  };
  const show = (v, f) => v === null || v === undefined ? "–" : F[f](v);
  const tbody = document.querySelector("#stats tbody");
  const groups = { final_value: "Return", volatility: "Risk", time_in_market: "Trading" };
  tbody.innerHTML = DATA.stats.map(r => {
    let sWin = false, bWin = false;
    if (r.better && r.strategy !== null && r.benchmark !== null && r.strategy !== r.benchmark) {
      const sBetter = r.better === "higher" ? r.strategy > r.benchmark : r.strategy < r.benchmark;
      sWin = sBetter; bWin = !sBetter;
    }
    const head = groups[r.key] ? `<tr class="group"><td colspan="3">${groups[r.key]}</td></tr>` : "";
    return head + `<tr><td><span class="lbl">${esc(r.label)}</span><span class="why">${esc(r.note)}</span></td>` +
      `<td class="num${sWin ? " win" : ""}">${show(r.strategy, r.fmt)}</td>` +
      `<td class="num${bWin ? " win" : ""}">${show(r.benchmark, r.fmt)}</td></tr>`;
  }).join("");
  document.getElementById("statsWrap").hidden = false;
}
setRange(12);
</script>
